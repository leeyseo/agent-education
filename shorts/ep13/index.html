<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EP13 "다 했습니다!"의 함정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700;900&display=block" rel="stylesheet">
<link rel="stylesheet" href="../lib/base.css">
<style>
  .pinr { position: absolute; background: var(--red); color: #fff; border-radius: 18px; padding: 10px 18px; font-size: 28px; font-weight: 900;
    box-shadow: 0 6px 14px rgba(0,0,0,.15); }
  .hole { position: absolute; border: 6px dashed var(--red); border-radius: 14px; }
  .say { position: absolute; background: #fff; border: 5px solid var(--ink); border-radius: 32px; padding: 20px 28px; font-size: 38px; font-weight: 900; }
  .spark { position: absolute; font-size: 60px; color: var(--yellow); font-weight: 900; }
  .tl.big { font-size: 40px; min-height: 70px; }
</style>
</head>
<body>
<div id="viewport"><div id="stage"><div class="abs" id="area">

  <!-- s1: 다 했습니다! -->
  <div class="scene" id="s1">
    <div class="term" id="s1-term" style="left:0;top:40px;width:600px;height:260px">
      <div class="tbar"><i></i><i></i><i></i><span>morningbread-site</span></div>
      <div class="tl done big"><span class="ic">✓</span>다 했습니다!</div>
      <div class="tl" style="color:#9AA3AE">메뉴에 '오시는 길' 추가 완료</div>
    </div>
    <div class="abs" id="s1-yj" data-char="yj:thumb:proud" style="left:620px;top:120px;width:320px;height:512px"></div>
    <div class="spark" id="s1-sp1" style="left:610px;top:90px">✦</div>
    <div class="spark" id="s1-sp2" style="left:900px;top:160px">✦</div>
  </div>

  <!-- s2: 폰에서 깨짐 -->
  <div class="scene" id="s2">
    <div class="label" id="s2-label"><div class="l1 disp">폰으로 열어 보니</div></div>
    <div class="phone" id="s2-phone" style="left:280px;top:100px;width:400px;height:760px"><div style="position:absolute;inset:44px 0 0 0" data-site="broken:1.3"></div></div>
    <div class="pinr" id="s2-p1" style="left:620px;top:330px">화면 밖으로 삐져나감</div>
    <div class="pinr" id="s2-p2" style="left:40px;top:640px">버튼 어디 갔지?</div>
  </div>

  <!-- s3: 다른 페이지 메뉴 사라짐 -->
  <div class="scene" id="s3">
    <div class="browser" id="s3-br" style="left:0;top:40px;width:960px;height:660px">
      <div class="bbar"><i></i><i></i><i></i><div class="url">morningbread.example/about.html</div></div>
      <div class="bbody" id="s3-body" style="height:600px"></div>
    </div>
    <div class="hole" id="s3-hole" style="left:20px;top:110px;width:920px;height:80px"></div>
    <div class="pinr" id="s3-p" style="left:560px;top:200px">메뉴 어디 갔어?</div>
  </div>

  <!-- s4: 확인 없이 했다고 -->
  <div class="scene" id="s4">
    <div class="abs" id="s4-boss" data-char="boss:skeptic" style="left:0;top:200px;width:360px;height:504px"></div>
    <div class="abs" id="s4-yj" data-char="yj:stand:oops" style="left:600px;top:240px;width:320px;height:512px"></div>
    <div class="say" id="s4-q" style="left:20px;top:40px">진짜 확인했어?</div>
    <div class="say" id="s4-a" style="left:500px;top:100px">사실… 안 열어 봤어요</div>
  </div>

  <!-- s5: 결론 -->
  <div class="scene" id="s5">
    <div class="abs conclude" id="s5-c" style="top:160px"><div class="k" style="background:var(--red);color:#fff">사고 일지 #2</div><div class="t">말을 믿지 말고<br><span>결과를 열어 보자</span></div></div>
  </div>

</div></div></div>
<script src="timeline.js"></script>
<script src="../lib/engine.js"></script>
<script>
// about.html: 메뉴(nav)가 사라진 화면
$('s3-body').style.setProperty('--s', 1.9);
$('s3-body').innerHTML = siteMock('A');
$('s3-body').querySelector('.nav').style.visibility = 'hidden';

start({
  s1(t, d, m, W) {
    pop($('s1-term'), t, 0.05, 0.4);
    rise($('s1-yj'), t, 0.2, 0.4, 80);
    ['s1-sp1', 's1-sp2'].forEach((id, i) => { const k = (t * 2 + i * 0.5) % 1; put($(id), t > 0.4 ? 1 - k * 0.6 : 0, 0, 0.7 + k * 0.5, k * 90); });
  },

  s2(t, d, m, W) {
    rise($('s2-label'), t, 0);
    rise($('s2-phone'), t, 0.15, 0.4, 60);
    pop($('s2-p1'), t, when(W, '화면이') - 0.1, 0.35, -3);
    pop($('s2-p2'), t, when(W, '깨져') + 0.2, 0.35, 3);
  },

  s3(t, d, m, W) {
    rise($('s3-br'), t, 0.05, 0.4, 50);
    pop($('s3-hole'), t, when(W, '메뉴가') - 0.1, 0.35);
    pop($('s3-p'), t, when(W, '사라졌어요') - 0.1, 0.35, -3);
  },

  s4(t, d, m, W) {
    rise($('s4-boss'), t, 0.05, 0.4, 80);
    rise($('s4-yj'), t, 0.2, 0.4, 80);
    pop($('s4-q'), t, 0.4, 0.35);
    pop($('s4-a'), t, when(W, '했다고') - 0.2, 0.35);
  },

  s5(t, d, m, W) {
    pop($('s5-c'), t, 0.2, 0.45);
  },
});
</script>
</body>
</html>
