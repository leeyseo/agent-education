<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디자이너 편 EP4 악덕 사수가 이긴다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700;900&display=block" rel="stylesheet">
<link rel="stylesheet" href="../../lib/base.css">
<link rel="stylesheet" href="../s2.css">
<style>
  .who { position: absolute; font-size: 36px; font-weight: 900; color: #fff; padding: 8px 26px; border-radius: 999px; white-space: nowrap; }
  .who.a { background: #9C9187; } .who.b { background: var(--red); }
  .vs { position: absolute; font-family: 'Black Han Sans', sans-serif; font-size: 80px; color: #C2B39F; }
  .pair-arrow { position: absolute; font-size: 64px; font-weight: 900; color: #C2B39F; }
  .sw { position: absolute; display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 900; white-space: nowrap; }
  .sw i { width: 64px; height: 64px; border-radius: 50%; }
  #s6-doc .dh { font-size: 52px; }
  #s6-doc .dl { font-size: 36px; margin-top: 10px; }
  #s6-doc .dl::before { top: 24px; }
  .reason { color: var(--sub); }
  .reason.on { color: var(--mint); }
</style>
</head>
<body>
<div id="viewport"><div id="stage"><div class="abs" id="area">

  <!-- s1: 같은 AI, 사수만 다르다 -->
  <div class="scene" id="s1">
    <div class="real" id="s1-real" style="left:300px;top:0">실제 Claude 결과물</div>
    <div class="who a" id="s1-wa" style="left:150px;top:70px">사수 A</div>
    <div class="who b" id="s1-wb" style="left:650px;top:70px">사수 B</div>
    <div class="lg" data-logo="A02" id="s1-a" style="left:0;top:150px;width:430px;height:430px"></div>
    <div class="vs" id="s1-vs" style="left:438px;top:310px">vs</div>
    <div class="lg" data-logo="B1" id="s1-b" style="left:530px;top:150px;width:430px;height:430px"></div>
    <div class="abs" id="s1-sa" data-char="person:sian:smile" style="left:110px;top:620px;width:200px;height:280px"></div>
    <div class="abs" id="s1-sb" data-char="person:sian:skeptic" style="left:640px;top:620px;width:200px;height:280px"></div>
  </div>

  <!-- s2: 사수 A -->
  <div class="scene" id="s2">
    <div class="who a" id="s2-w" style="left:0;top:0">사수 A</div>
    <div class="ub" id="s2-u" style="left:120px;right:auto;top:120px;font-size:44px;padding:24px 36px">음, 괜찮네. 좀 더 예쁘게 해 봐.</div>
    <div class="abs" id="s2-sian" data-char="person:sian:smile" style="left:300px;top:340px;width:400px;height:560px"></div>
  </div>

  <!-- s3: 조금씩만 다듬어 옴 -->
  <div class="scene" id="s3">
    <div class="real" id="s3-real" style="left:0;top:0">실제 결과 · 1차 → 사수 A 피드백 후</div>
    <div class="lg" data-logo="L02" id="s3-b1" style="left:130px;top:70px;width:250px;height:250px"></div>
    <div class="pair-arrow" style="left:430px;top:150px">→</div>
    <div class="lg" data-logo="A02" id="s3-a1" style="left:540px;top:70px;width:250px;height:250px"></div>
    <div class="lg" data-logo="L04" id="s3-b2" style="left:130px;top:350px;width:250px;height:250px"></div>
    <div class="pair-arrow" style="left:430px;top:430px">→</div>
    <div class="lg" data-logo="A04" id="s3-a2" style="left:540px;top:350px;width:250px;height:250px"></div>
    <div class="lg" data-logo="L08" id="s3-b3" style="left:130px;top:630px;width:250px;height:250px"></div>
    <div class="pair-arrow" style="left:430px;top:710px">→</div>
    <div class="lg" data-logo="A08" id="s3-a3" style="left:540px;top:630px;width:250px;height:250px"></div>
    <div class="sticker yellow" id="s3-st" style="left:600px;top:20px">어디가 바뀌었지?</div>
  </div>

  <!-- s4: 사수 B -->
  <div class="scene" id="s4">
    <div class="who b" id="s4-w" style="left:0;top:0">사수 B</div>
    <div class="lgrid4" id="s4-grid" data-r1 style="left:180px;top:0;width:780px"></div>
    <div class="abs" id="s4-sian" data-char="person:sian:skeptic" style="left:0;top:620px;width:210px;height:294px"></div>
    <div class="sw" id="s4-sw1" style="left:300px;top:660px"><i style="background:#1E2A4A"></i>새벽 남색</div>
    <div class="sw" id="s4-sw2" style="left:600px;top:660px"><i style="background:#C7772E"></i>크러스트 갈색</div>
    <div class="sticker red" id="s4-st" style="left:380px;top:780px">색은 두 개만</div>
  </div>

  <!-- s5: 사수 B가 받은 결과 -->
  <div class="scene" id="s5">
    <div class="real" id="s5-real" style="left:0;top:0">실제 결과 · 사수 B 피드백 후</div>
    <div class="lg" data-logo="B1" id="s5-b1" style="left:0;top:60px;width:460px;height:460px"></div>
    <div class="lg" data-logo="B3" id="s5-b3" style="left:500px;top:60px;width:460px;height:460px"></div>
    <div class="lg" data-logo="B2" id="s5-b2" style="left:0;top:550px;width:960px;height:369px"></div>
  </div>

  <!-- s6: 악덕 = 이유를 말하는 사람 -->
  <div class="scene" id="s6">
    <div class="doc" id="s6-doc" style="left:0;top:0;width:960px">
      <div class="dh">사수 B의 피드백</div>
      <div class="dl">✕ 6·11·12번 <span class="reason" id="s6-r1">— 카페 로고랑 구분이 안 돼서</span></div>
      <div class="dl">○ 2번 <span class="reason" id="s6-r2">— '새벽에 굽는 집' 이야기가 보여서</span></div>
      <div class="dl">색 두 개 <span class="reason" id="s6-r3">— 어디서 봐도 한눈에 기억되게</span></div>
    </div>
    <div class="abs" id="s6-sian" data-char="person:sian:skeptic" style="left:330px;top:420px;width:300px;height:420px"></div>
    <div class="sticker red" id="s6-s1" style="left:20px;top:520px">욕 ✕</div>
    <div class="sticker mint" id="s6-s2" style="left:690px;top:560px">이유 ○</div>
  </div>

  <!-- s7: 결론 -->
  <div class="scene" id="s7">
    <div class="abs" data-chair style="left:350px;top:0;width:260px;height:364px"></div>
    <div class="abs" id="s7-sian" data-char="person:sian:skeptic" style="left:370px;top:10px;width:220px;height:308px"></div>
    <div class="abs conclude" id="s7-c" style="top:400px"><div class="k">오늘의 결론</div><div class="t">까다로운 사수가<br><span>좋은 시안을 받는다</span></div></div>
  </div>

</div></div></div>
<script src="timeline.js"></script>
<script src="../../lib/engine.js"></script>
<script src="../s2.js"></script>
<script>
start({
  s1(t, d, m, W) {
    pop($('s1-a'), t, 0.2, 0.4);
    pop($('s1-b'), t, 0.45, 0.4);
    fade($('s1-vs'), t, 0.6, 0.3);
    const at = when(W, '사수만') - 0.1;
    pop($('s1-wa'), t, at, 0.35);
    pop($('s1-wb'), t, at + 0.15, 0.35);
    rise($('s1-sa'), t, at + 0.2, 0.4, 60);
    rise($('s1-sb'), t, at + 0.3, 0.4, 60);
    pop($('s1-real'), t, when(W, '달라졌어요') - 0.2, 0.35);
  },

  s2(t, d, m, W) {
    pop($('s2-w'), t, 0.1, 0.35);
    rise($('s2-sian'), t, 0.2, 0.4, 80);
    pop($('s2-u'), t, m[1] - 0.1, 0.4);
  },

  s3(t, d, m, W) {
    ['b1', 'a1', 'b2', 'a2', 'b3', 'a3'].forEach((k, i) => pop($(`s3-${k}`), t, 0.15 + i * 0.12, 0.3));
    fade($('s3-real'), t, 0.2, 0.3);
    pop($('s3-st'), t, when(W, '조금씩만') - 0.1, 0.4, 3);
  },

  s4(t, d, m, W) {
    pop($('s4-w'), t, 0.1, 0.35);
    for (let i = 1; i <= 12; i++) pop(cell('s4-grid', i), t, 0.15 + (i - 1) * 0.04, 0.25);
    rise($('s4-sian'), t, 0.3, 0.4, 60);
    const x = when(W, '버려.') - 0.6;
    [6, 11, 12].forEach((n, i) => {
      mark('s4-grid', n, 'x', '버려', t, x + i * 0.2);
      cell('s4-grid', n).classList.toggle('dim', t >= x + i * 0.2);
    });
    const o = when(W, '살리고') - 0.2;
    mark('s4-grid', 2, 'o', '살려', t, o);
    cell('s4-grid', 2).classList.toggle('pick', t >= o);
    mark('s4-grid', 4, 't', '보강', t, when(W, '찌그러지게') - 0.2);
    const c = when(W, '두') - 0.2;
    rise($('s4-sw1'), t, c, 0.3, 20);
    rise($('s4-sw2'), t, c + 0.15, 0.3, 20);
    pop($('s4-st'), t, c + 0.3, 0.4, -3);
  },

  s5(t, d, m, W) {
    pop($('s5-b1'), t, 0.15, 0.4);
    pop($('s5-b3'), t, 0.4, 0.4);
    pop($('s5-b2'), t, 0.65, 0.4);
    fade($('s5-real'), t, 0.3, 0.3);
  },

  s6(t, d, m, W) {
    rise($('s6-doc'), t, 0.1, 0.35, 40);
    rise($('s6-sian'), t, 0.3, 0.4, 60);
    pop($('s6-s1'), t, when(W, '욕하는') - 0.1, 0.35, -5);
    const r = when(W, '이유를') - 0.1;
    ['s6-r1', 's6-r2', 's6-r3'].forEach((id, i) => $(id).classList.toggle('on', t >= r + i * 0.2));
    pop($('s6-s2'), t, r, 0.35, 4);
  },

  s7(t, d, m, W) {
    rise($('s7-sian'), t, 0.1, 0.4, 60);
    pop($('s7-c'), t, Math.max(when(W, '좋은') - 0.4, 0.6), 0.45);
  },
});
</script>
</body>
</html>
