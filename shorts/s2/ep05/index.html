<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디자이너 편 EP5 그래서 시니어가 필요하다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700;900&display=block" rel="stylesheet">
<link rel="stylesheet" href="../../lib/base.css">
<link rel="stylesheet" href="../s2.css">
<style>
  .qmark { position: absolute; font-family: 'Black Han Sans', sans-serif; font-size: 200px; color: var(--orange); }
  .cap2 { position: absolute; font-size: 30px; font-weight: 900; text-align: center; white-space: nowrap; }
  .px { position: absolute; background: #fff; border-radius: 18px; border: 3px solid var(--line); box-shadow: 0 10px 24px rgba(60, 40, 20, .12); }
  .sw { position: absolute; width: 400px; display: flex; align-items: center; gap: 18px; font-size: 32px; font-weight: 900; white-space: nowrap; }
  .sw i { width: 90px; height: 90px; border-radius: 22px; flex: none; }
  .sw small { display: block; font: 22px var(--mono); color: var(--sub); }
  .lbl { position: absolute; font-size: 40px; font-weight: 900; padding: 10px 26px; border-radius: 999px; color: #fff; white-space: nowrap; }
</style>
</head>
<body>
<div id="viewport"><div id="stage"><div class="abs" id="area">

  <!-- s1: 디자이너는 필요 없을까 -->
  <div class="scene" id="s1">
    <div class="lgrid4" id="s1-grid" data-r1 style="left:180px;top:0;width:600px"></div>
    <div class="abs" id="s1-yj" data-char="yj:cheer:proud" style="left:20px;top:470px;width:280px;height:448px"></div>
    <div class="abs" id="s1-sian" data-char="person:sian:shock" style="left:640px;top:520px;width:280px;height:392px"></div>
    <div class="qmark" id="s1-q" style="left:420px;top:540px">?</div>
  </div>

  <!-- s2: 뭘 살릴지, 왜 아닌지 -->
  <div class="scene" id="s2">
    <div class="lgrid4" id="s2-grid" data-r1 style="left:100px;top:0;width:760px"></div>
    <div class="abs" id="s2-sian" data-char="person:sian:skeptic" style="left:40px;top:600px;width:220px;height:308px"></div>
    <div class="sticker orange" id="s2-st" style="left:330px;top:680px">왜 아닌지 말할 수 있나?</div>
  </div>

  <!-- s3: 작아지면 뭉개진다 (실제 시안 07을 줄여 본 화면) -->
  <div class="scene" id="s3">
    <div class="lg" data-logo="L07" id="s3-big" style="left:0;top:40px;width:440px;height:440px"></div>
    <div class="cap2" style="left:0;top:500px;width:440px">원래 크기</div>
    <div class="px" id="s3-small" style="left:520px;top:120px;width:300px;height:300px;padding:30px"><canvas id="s3-cv" width="240" height="240"></canvas></div>
    <div class="cap2" style="left:470px;top:500px;width:400px">명함·아이콘 크기<br><span class="cs" style="font-size:24px">48px로 줄여 확대한 모습</span></div>
    <div class="sticker red" id="s3-st" style="left:600px;top:40px">뭉개짐</div>
    <div class="abs" id="s3-sian" data-char="person:sian:skeptic" style="left:370px;top:620px;width:210px;height:294px"></div>
  </div>

  <!-- s4: 덜 구워진 색 -->
  <div class="scene" id="s4">
    <div class="lg" data-logo="L06" id="s4-logo" style="left:0;top:40px;width:440px;height:440px"></div>
    <div class="sw" id="s4-w1" style="left:500px;top:100px"><i style="background:#E0A526"></i><span>덜 구운 색<small>#E0A526</small></span></div>
    <div class="sw" id="s4-w2" style="left:500px;top:280px"><i style="background:#C7772E"></i><span>잘 구운 색<small>#C7772E</small></span></div>
    <div class="abs" id="s4-sian" data-char="person:sian:skeptic" style="left:370px;top:560px;width:240px;height:336px"></div>
  </div>

  <!-- s5: 손은 빌려도 눈은 못 빌린다 -->
  <div class="scene" id="s5">
    <div class="abs" id="s5-yj" data-char="yj:laptop:smile" style="left:20px;top:120px;width:400px;height:560px"></div>
    <div class="lbl" id="s5-l1" style="left:100px;top:720px;background:var(--mint)">손 = AI</div>
    <div class="abs" id="s5-sian" data-char="person:sian:proud" style="left:540px;top:150px;width:400px;height:560px"></div>
    <div class="lbl" id="s5-l2" style="left:610px;top:720px;background:var(--ink)">눈 = 나</div>
    <div class="sticker yellow" id="s5-st" style="left:300px;top:20px">경험에서 나오는 눈</div>
  </div>

  <!-- s6: 결론 -->
  <div class="scene" id="s6">
    <div class="abs" data-chair style="left:350px;top:0;width:260px;height:364px"></div>
    <div class="abs" id="s6-sian" data-char="person:sian:proud" style="left:370px;top:10px;width:220px;height:308px"></div>
    <div class="abs conclude" id="s6-c" style="top:400px"><div class="k">오늘의 결론</div><div class="t">AI 시대에 더 비싸지는 것<br><span>보는 눈</span></div></div>
  </div>

</div></div></div>
<script src="timeline.js"></script>
<script src="../../lib/engine.js"></script>
<script src="../s2.js"></script>
<script>
// 실제 시안 07을 48px로 줄였다가 다시 키워서, 작은 크기에서 어떻게 보이는지 그대로 보여 준다
let drawn = false;
function drawSmall() {
  if (drawn) return;
  const img = $('s3-big').querySelector('img');
  const tiny = document.createElement('canvas');
  tiny.width = tiny.height = 48;
  tiny.getContext('2d').drawImage(img, 0, 0, 48, 48);
  const cv = $('s3-cv').getContext('2d');
  cv.imageSmoothingEnabled = false;
  cv.drawImage(tiny, 0, 0, 240, 240);
  drawn = true;
}

start({
  s1(t, d, m, W) {
    for (let i = 1; i <= 12; i++) pop(cell('s1-grid', i), t, 0.1 + (i - 1) * 0.05, 0.25);
    rise($('s1-yj'), t, 0.3, 0.4, 80);
    rise($('s1-sian'), t, when(W, '디자이너는') - 0.2, 0.4, 80);
    pop($('s1-q'), t, when(W, '필요') - 0.1, 0.4, 8);
  },

  s2(t, d, m, W) {
    for (let i = 1; i <= 12; i++) {
      const c = cell('s2-grid', i).querySelector('.mk');
      c.className = 'mk t';
      c.textContent = '?';
      pop(c, t, when(W, '열두') + (i - 1) * 0.06, 0.3);
    }
    rise($('s2-sian'), t, 0.2, 0.4, 60);
    pop($('s2-st'), t, when(W, '왜') - 0.1, 0.4, -3);
  },

  s3(t, d, m, W) {
    drawSmall();
    pop($('s3-big'), t, 0.15, 0.4);
    pop($('s3-small'), t, when(W, '줄이면') - 0.1, 0.4);
    pop($('s3-st'), t, when(W, '뭉개져') - 0.05, 0.4, 5);
    rise($('s3-sian'), t, 0.3, 0.4, 60);
  },

  s4(t, d, m, W) {
    pop($('s4-logo'), t, 0.15, 0.4);
    rise($('s4-w1'), t, when(W, '노란색은') - 0.1, 0.3, 20);
    rise($('s4-w2'), t, when(W, '덜') + 0.3, 0.3, 20);
    rise($('s4-sian'), t, 0.3, 0.4, 60);
  },

  s5(t, d, m, W) {
    pop($('s5-st'), t, when(W, '경험') - 0.1, 0.4, -3);
    rise($('s5-yj'), t, when(W, '손은') - 0.3, 0.4, 60);
    pop($('s5-l1'), t, when(W, '손은'), 0.35);
    // '눈은'은 첫 문장에도 있으니, 둘째 '눈은' 바로 뒤의 '못'으로 맞춘다
    rise($('s5-sian'), t, when(W, '못') - 0.6, 0.4, 60);
    pop($('s5-l2'), t, when(W, '못') - 0.3, 0.35);
  },

  s6(t, d, m, W) {
    rise($('s6-sian'), t, 0.1, 0.4, 60);
    pop($('s6-c'), t, Math.max(when(W, '보는') - 0.4, 0.6), 0.45);
  },
});
</script>
</body>
</html>
